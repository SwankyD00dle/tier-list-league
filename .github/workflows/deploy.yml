name: Deploy sandbox

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/deploy-sandbox.test.mjs
      - run: npm run test:integration --workspace @tier-list-league/backend

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: sandbox
    steps:
      - uses: actions/checkout@v6
      - name: Update and restart application
        shell: bash
        run: |
          set -euo pipefail
          : "${PLATFORM_API_KEY:?Missing PLATFORM_API_KEY}"
          : "${PLATFORM_SANDBOX_ID:?Missing PLATFORM_SANDBOX_ID}"
          [[ "$PLATFORM_SANDBOX_ID" =~ ^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$ ]]
          [[ "$PLATFORM_API_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          request() {
            curl --fail --silent --show-error --proto '=https' \
              --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors \
              --header "Authorization: Bearer $PLATFORM_API_KEY" \
              --header 'Content-Type: application/json' \
              --output "$response" "$@"
          }
          payload=$(jq -n --rawfile script scripts/sandbox-deploy.sh \
            '{argv: ["bash", "-lc", $script], cwd: "/app", timeoutMs: 900000}')
          # curl retries reuse this key so a lost response cannot start a second deployment.
          request --request POST --header "Idempotency-Key: $(cat /proc/sys/kernel/random/uuid)" \
            --data "$payload" "$PLATFORM_API_URL/v1/sandboxes/$PLATFORM_SANDBOX_ID/exec"
          execution_id=$(jq -er '.id | select(type == "string" and test("^[a-fA-F0-9-]{36}$"))' "$response")
          echo "Deployment exec: $execution_id"
          for attempt in {1..190}; do
            request "$PLATFORM_API_URL/v1/execs/$execution_id"
            status=$(jq -er '.status' "$response")
            if [[ "$status" == exited ]] && jq -e '.exitCode == 0' "$response" >/dev/null; then
              echo 'Application updated and restarted.'
              exit 0
            fi
            case "$status" in
              starting|running) sleep 5 ;;
              *) echo "Deployment exec $execution_id failed. Inspect its output in the platform." >&2; exit 1 ;;
            esac
          done
          echo "Deployment exec $execution_id did not finish. Inspect it before retrying." >&2
          exit 1
        env:
          PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL || 'https://platform.adaptstaging.com' }}
          PLATFORM_SANDBOX_ID: ${{ secrets.PLATFORM_SANDBOX_ID }}
          PLATFORM_API_KEY: ${{ secrets.PLATFORM_API_KEY }}
