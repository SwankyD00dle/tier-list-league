services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tier_list_league_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tier_list_league_test"]
      interval: 1s
      timeout: 5s
      retries: 30
  tests:
    build:
      context: ../..
      dockerfile: packages/backend/Dockerfile
      target: migrate
    environment:
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/tier_list_league_test
    command: ["npm", "run", "test:integration"]
    depends_on:
      db:
        condition: service_healthy
