services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tier_list_league
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tier_list_league"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ../..
      dockerfile: packages/backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/tier_list_league
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../..
      dockerfile: packages/backend/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/tier_list_league
      PORT: "3001"
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Set DISCORD_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      FRONTEND_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      DISCORD_REDIRECT_URI: ${APP_PUBLIC_URL:-http://localhost:3000}/api/auth/discord/callback
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ../..
      dockerfile: packages/frontend/Dockerfile
      args:
        APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
        BACKEND_URL: http://backend:3001
    init: true
    restart: unless-stopped
    environment:
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      BACKEND_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
